        <circle cx="8" cy="4.5" r="2.5" />
        <path d="M3 14v-2a5 5 0 0 1 10 0v2" />
      </g>
      <text x="614.4" y="36" class="jarden-flow-node-label" font-size="11" font-weight="600" text-anchor="middle">确认方案</text>
      <text x="614.4" y="49" class="jarden-flow-node-detail" font-size="10" text-anchor="middle">仅用户明确采用</text>
