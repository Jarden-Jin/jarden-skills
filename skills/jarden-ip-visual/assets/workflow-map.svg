<svg xmlns="http://www.w3.org/2000/svg" id="jarden-flow-map" viewBox="40 0 777 77.7" width="1100" height="110" preserveAspectRatio="xMidYMid meet" role="img" lang="zh-CN" aria-labelledby="jarden-flow-title jarden-flow-description" data-flow-mode="reading-map" data-flow-provenance="archify-native-workflow-v2" data-flow-runtime-source="external">
  <title id="jarden-flow-title">Jarden 按需资产工作地图</title>
  <desc id="jarden-flow-description">六个节点是按需工作的阅读地图，不是每个请求必须依次经历的步骤。审查需修改和用户要求返修都可返回设计制作。确认方案只能由用户明确采用。此静态图不预设当前阶段或完成比例；当前 phase/status 由宿主工作台的真实数据标注。</desc>
  <metadata id="jarden-flow-provenance">{"generator":"Archify","version":"3.2.0","native_type":"workflow","native_schema_version":2,"repository_revision":"81a8c1b9e579ac0aeda97c882f073f795e87c544","candidate_sha256":"a8a66310660ccfa10bb34b13b163197cd2bcb9a44e35c92c93660a97d0bd1675","native_html_sha256":"f7840b778ad0386a0fb8812a4ae5612c40f21e5834adef8ca028c7cdc4935174","native_finalize":"pass","derivative":"从已验证原生 HTML 提取节点、连线、箭头和文字，压缩纵向间距并重排。完整原生图保留为展开详情；派生 SVG 单独验证，不冒称原生 finalize 的输出。"}</metadata>
  <style>:where(#jarden-flow-map){font-family:system-ui,sans-serif}
:where(#jarden-flow-map) .jarden-flow-node-surface{fill:var(--jarden-flow-node-fill,var(--jarden-flow-surface,#fff));stroke:var(--jarden-flow-node-stroke,var(--jarden-flow-stroke,#8b9099))}
:where(#jarden-flow-map) .jarden-flow-node-label{fill:var(--jarden-flow-node-text,var(--jarden-flow-text,#26292f))}
:where(#jarden-flow-map) .jarden-flow-node-detail{fill:var(--jarden-flow-node-muted,var(--jarden-flow-muted,#646a75))}
:where(#jarden-flow-map) .jarden-flow-sigil{fill:none;stroke:var(--jarden-flow-node-stroke,var(--jarden-flow-stroke,#8b9099));stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
:where(#jarden-flow-map) .jarden-flow-edge{fill:none;stroke:var(--jarden-flow-edge-color,var(--jarden-flow-line,#969da8));stroke-linecap:round;stroke-linejoin:round}
:where(#jarden-flow-map) .jarden-flow-arrow{fill:var(--jarden-flow-edge-color,var(--jarden-flow-line,#969da8))}
:where(#jarden-flow-map) .jarden-flow-edge-text{fill:var(--jarden-flow-edge-text,var(--jarden-flow-muted,#646a75))}
:where(#jarden-flow-map) .jarden-flow-label-mask{fill:var(--jarden-flow-background,var(--jarden-flow-surface,#fff))}</style>
