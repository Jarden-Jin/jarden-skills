      <title id="jarden-flow-node-create-title">设计制作</title>
      <desc id="jarden-flow-node-create-description">按需制作与复用</desc>
      <rect x="296" y="24" width="92" height="32" rx="8" class="jarden-flow-node-surface" style="--step:2" stroke-width="1.5" />
      <text x="342" y="36" class="jarden-flow-node-label" font-size="11" font-weight="600" text-anchor="middle">设计制作</text>
      <text x="342" y="49" class="jarden-flow-node-detail" font-size="10" text-anchor="middle">按需制作与复用</text>
