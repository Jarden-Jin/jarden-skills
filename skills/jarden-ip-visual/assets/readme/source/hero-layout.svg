<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="640" viewBox="0 0 1200 640"
     role="img" aria-labelledby="title desc">
  <title id="title">jarden-ip-visual：把原创草图做成可发布的 IP 周边视觉</title>
  <desc id="desc">左侧说明工作流与审查能力，右侧并置长耳兔毛绒挂件的封面、比例与桌面场景三张当前项目成图。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F4EA"/>
      <stop offset="0.62" stop-color="#F2EEE3"/>
      <stop offset="1" stop-color="#ECEBDD"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#E1E9DA"/>
      <stop offset="1" stop-color="#C9D7C2"/>
    </linearGradient>
    <radialGradient id="blush-wash" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#E9C8C9" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#E9C8C9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-main">
      <rect x="834" y="88" width="272" height="363" rx="20"/>
    </clipPath>
    <clipPath id="clip-scale">
      <rect x="670" y="238" width="190" height="253" rx="18"/>
    </clipPath>
    <clipPath id="clip-scene">
      <rect x="944" y="356" width="172" height="229" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="640" rx="30" fill="url(#paper)"/>
  <circle cx="902" cy="294" r="310" fill="url(#blush-wash)"/>

  <g id="editorial-copy" fill="#20332A">
    <g id="metadata" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
      <circle cx="67" cy="61" r="4" fill="#D9A1AC"/>
      <text x="82" y="67" font-size="18" font-weight="700" letter-spacing="2.3">JARDEN / SKILL</text>
      <text x="64" y="104" fill="#617065" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="25" font-weight="500" letter-spacing="0.3">jarden-ip-visual / 0.2.1</text>
    </g>

    <g id="headline" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="-1.6">
      <text x="64" y="174">把原创草图，</text>
      <text x="64" y="240">做成能发的</text>
      <text x="64" y="306" fill="#315D49">IP 周边视觉。</text>
    </g>

    <path id="separator" d="M64 340H541" stroke="#C6CFC2" stroke-width="1.5"/>
    <path d="M64 340h38" stroke="#D9A1AC" stroke-width="3" stroke-linecap="round"/>

    <g id="value-copy" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
      <text x="64" y="380" font-size="25" font-weight="650">毛绒 / 拼图 / 手办</text>
      <text x="64" y="412" fill="#647268" font-size="19" font-weight="450">每轮先对比，再确认；最后交付整套发帖素材。</text>
    </g>

    <g id="capability-labels" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" font-weight="600">
      <g transform="translate(64 441)">
        <rect width="132" height="36" rx="18" fill="#E4EADD"/>
        <circle cx="18" cy="18" r="3.5" fill="#315D49"/>
        <text x="31" y="24" fill="#315D49">3–5 个方向</text>
      </g>
      <g transform="translate(208 441)">
        <rect width="154" height="36" rx="18" fill="#F2E1E1"/>
        <circle cx="18" cy="18" r="3.5" fill="#A95F6C"/>
        <text x="31" y="24" fill="#75434B">独立物理审查</text>
      </g>
      <g transform="translate(374 441)">
        <rect width="188" height="36" rx="18" fill="#F3EAD8"/>
        <circle cx="18" cy="18" r="3.5" fill="#9A764A"/>
        <text x="31" y="24" fill="#735B38">图片 + 文案 + tag</text>
      </g>
    </g>

    <g id="stage-sequence" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
      <path d="M66 525H555" stroke="#AEBBAA" stroke-width="1.5" stroke-dasharray="4 8"/>
      <g fill="#315D49">
        <circle cx="85" cy="525" r="5"/>
        <circle cx="188" cy="525" r="5"/>
        <circle cx="304" cy="525" r="5"/>
        <circle cx="427" cy="525" r="5"/>
        <circle cx="542" cy="525" r="5"/>
      </g>
      <g fill="#657168" font-size="18" font-weight="550">
        <text x="64" y="560">概念</text>
        <text x="164" y="560">材质</text>
        <text x="276" y="560">透明图</text>
        <text x="408" y="560">场景</text>
        <text x="516" y="560">发帖</text>
      </g>
    </g>

    <text x="64" y="610" fill="#7B837B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="17" font-weight="450">保留原创造型空间，不固定角色模板。</text>
  </g>

  <path id="transition-thread"
        d="M568 468C604 449 615 414 646 401"
        fill="none" stroke="#B98D91" stroke-width="2.2" stroke-dasharray="6 9" stroke-linecap="round"/>
  <path d="M637 393L648 401L637 410" fill="none" stroke="#B98D91" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="artifact-board">
    <rect x="642" y="58" width="500" height="524" rx="36" fill="#9EAF96" opacity="0.22" transform="translate(5 9)"/>
    <rect x="642" y="58" width="500" height="524" rx="36" fill="url(#board)"/>
    <rect x="662" y="78" width="460" height="484" rx="27" fill="none" stroke="#AABCA5" stroke-width="1.5" stroke-dasharray="7 9"/>

    <g id="photo-main" transform="rotate(1.8 970 270)">
      <rect x="840" y="96" width="272" height="363" rx="20" fill="#20332A" opacity="0.13"/>
      <image href="hero-cover.jpg" x="834" y="88" width="272" height="363"
             preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-main)"/>
      <rect x="834" y="88" width="272" height="363" rx="20" fill="none" stroke="#FBF7EE" stroke-width="7"/>
      <g transform="translate(978 110)">
        <rect width="112" height="28" rx="14" fill="#FBF7EE" opacity="0.94"/>
        <text x="14" y="19" fill="#315D49" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="600">01 / COVER</text>
      </g>
    </g>

    <g id="photo-scale" transform="rotate(-4.2 765 365)">
      <rect x="676" y="246" width="190" height="253" rx="18" fill="#20332A" opacity="0.14"/>
      <image href="hero-scale.jpg" x="670" y="238" width="190" height="253"
             preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-scale)"/>
      <rect x="670" y="238" width="190" height="253" rx="18" fill="none" stroke="#FBF7EE" stroke-width="6"/>
      <g transform="translate(685 453)">
        <rect width="104" height="26" rx="13" fill="#FBF7EE" opacity="0.94"/>
        <text x="12" y="18" fill="#315D49" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="600">02 / SCALE</text>
      </g>
    </g>

    <g id="photo-scene" transform="rotate(3.1 1030 470)">
      <rect x="950" y="364" width="172" height="229" rx="18" fill="#20332A" opacity="0.14"/>
      <image href="hero-scene.jpg" x="944" y="356" width="172" height="229"
             preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-scene)"/>
      <rect x="944" y="356" width="172" height="229" rx="18" fill="none" stroke="#FBF7EE" stroke-width="6"/>
      <g transform="translate(958 547)">
        <rect width="102" height="26" rx="13" fill="#FBF7EE" opacity="0.94"/>
        <text x="12" y="18" fill="#315D49" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="600">05 / SCENE</text>
      </g>
    </g>

    <g id="project-note" transform="translate(676 91)">
      <path d="M0 18Q0 0 18 0H170L188 18L170 36H18Q0 36 0 18Z" fill="#FBF3E2" stroke="#D9C6A6" stroke-width="1.3"/>
      <circle cx="17" cy="18" r="3" fill="none" stroke="#B99C74" stroke-width="1.2"/>
      <text x="31" y="24" fill="#6D604B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="17" font-weight="600">当前项目 · 长耳兔</text>
    </g>
  </g>

  <g id="artifact-caption" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="18">
    <circle cx="648" cy="613" r="3.5" fill="#D9A1AC"/>
    <text x="661" y="619" fill="#6A766B" font-weight="450">当前项目生成的 AI 设计效果图，非实物摄影。</text>
  </g>
</svg>
