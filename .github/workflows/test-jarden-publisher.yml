name: Jarden Publisher Checks

on:
  pull_request:
    paths:
      - "skills/jarden-publisher/**"
      - ".github/workflows/test-jarden-publisher.yml"
  push:
    paths:
      - "skills/jarden-publisher/**"
      - ".github/workflows/test-jarden-publisher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install Pillow
      - name: Run publisher regressions
        run: python -B -m unittest discover -s skills/jarden-publisher/tests -v
