name: Skill Regression Tests

on:
  pull_request:
    paths:
      - "skills/jarden-ip-visual/**"
      - "tools/build_release.py"
      - ".github/workflows/test-updates.yml"
  push:
    paths:
      - "skills/jarden-ip-visual/**"
      - "tools/build_release.py"
      - ".github/workflows/test-updates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-updates:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      JARDEN_UPDATE_HOME: ${{ runner.temp }}/jarden-update-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Install test dependency
        run: python -m pip install Pillow
      - name: Run workflow, delivery, review and update regressions
        run: python -m unittest discover -s skills/jarden-ip-visual/tests -v
